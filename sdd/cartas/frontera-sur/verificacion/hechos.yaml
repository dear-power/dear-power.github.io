  - afirmacion: >
      Hay convocatoria/movilizacion en redes para una nueva entrada masiva el
      15-ago-2026
    fuente: "Maldita.es (VERDADERO, monitoriza 21 grupos); Telecinco; Cronica Balear"
    fecha: "3-8 ago-2026"
    aguanta: si
    url: "https://maldita.es/investigaciones/20260807/antes-30-julio-organizo-entrada-ceuta-grupos-de-facebook/"
    nota: >
      VERDADERO que hay grupos organizando entrada el 15-ago, y la entrada del
      30-jul "se organizo antes del 30 de julio" (clave: los organizadores
      PRECEDEN al desmentido). Ceuta pidio refuerzos (8-ago); Defensa cancelo
