# hechos.yaml — verificación re-levantada desde cero (2026-08-11)
# Herramienta: buscador web local (metabuscador). Ninguna cifra heredada del
# material previo. Procedencia declarada por fuente (oficial / afín / hostil /
# independiente / regional). Transcripción literal del acta del ensemble.
#
# NOTA (acuerdo 003, propuesto): esta capa nombra emisores y medios porque una
# verificación sin emisor no es verificable. La carta final abstrae.

veredicto_global: >
  Las leyes destiladas por el preview AGUANTAN sobre hechos re-levantados desde
  cero. (c) MEDICION es la mas solida: no existe ni un solo contador
  independiente del flujo del 30-jul; toda cifra procede de una parte
  interesada y las cifras oficiales se contradicen entre si el mismo periodo.
  (b) INMUNIDAD aguanta: la STS 814/2026 (dictada 29-jun-2026) solo cambia el
  procedimiento; al viajar por redes se convirtio en "no hay deportacion
  inmediata" -> "frontera abierta el 15 de agosto", mensaje sin contenido
  falsable en su nucleo. (a) RENTA se sostiene por indeterminacion causal
  documentada. (d) VISIBILIDAD tambien: la ruta Argelia-Baleares (11.000
  llegadas en año y medio) NUNCA fue "crisis"; el espigon del Tarajal en 48h
  si. Caen cinco afirmaciones del guion (ver citas_que_caen); ninguna invalida
  las leyes, pero obligan a reescribir el pasaje numerico.

vacio_estructural: >
  CONFIRMADO. No existe ningun contador independiente del flujo del
  30-jul-2026. Todas las cifras proceden de partes con interes: Ministerio del
  Interior, Gobierno de la Ciudad Autonoma de Ceuta, autoridades marroquies,
  "fuentes oficiales" filtradas a medios. Frontex SI aparece en el episodio
  pero SOLO para la ruta Argelia-Baleares; no emitio recuento propio del cruce.
  Sin recuento discreto de FRA, ACNUR ni OIM. El hecho que dispara la crisis
  carece de arbitro numerico externo: condicion de posibilidad de la ley de la
  medicion.

citas_que_caen:
  - cae: "cifras oficiales de ~50.000 entradas y ~70.000 salidas el mismo dia"
    realidad: >
      El par documentado es 72.000 entradas / 70.000 salidas, emitido por
      Marlaska (Interior) el 4-ago-2026, no simultaneo al cruce. No se localiza
      fuente para "50.000 entradas". La incoherencia real y sostenible es
      tripartita: Interior 72.000/70.000 -> ~2.000 quedan; Gobierno de Ceuta
      ~10.000 siguen en la ciudad (11-ago); El Correo "entre 1.500 y 2.000 en
      diez dias" (30-jul). Tres cifras del mismo hecho que difieren hasta 50x:
      eso ES la ley de la medicion, y no necesita el "50.000".
  - cae: "un titular que se doblo de ~20.000 a ~40.000 conservando la URL vieja"
    realidad: >
      NO VERIFICABLE. Se confirma el titular "Mas de 20.000 personas entraron
      en Ceuta este jueves 30 de julio" (El Confidencial Digital), pero no una
      version a ~40.000 en la misma URL ni evidencia de edicion silenciosa.
      La pieza no debe apoyarse en este ejemplo; la cifra movil ya queda
      probada por la horquilla 1.500 -> 20.000 -> 72.000 entre medios y por dia.
  - cae: "horquilla de muertos entre once y ochenta y ocho"
    realidad: >
      El extremo inferior 11 no se confirma (minimo hallado: 18, recuento
      español temprano, 31-jul). El superior real supera 88: Cadena SER/Antena3
      dan 141 sumando aguas marroquies (78 ES + 63 MA); Gobierno de Ceuta 88;
      Guardia Civil 83. Horquilla honesta: "entre dieciocho y ciento cuarenta y
      uno, segun quien cuente y que aguas se cuenten". El ajuste REFUERZA la ley.
  - cae: "STS difundida ~8-jul-2026"
    realidad: >
      Solo consta DICTADA el 29-jun-2026 (explicada 5-ago). Enunciar "norma
      semanas anterior al foco mediatico, que llego con el cruce del 30-jul",
      sin fechar la difusion.
  - cae: "Ceuta +210%"
    realidad: >
      Con precision: "Ceuta Y Melilla, entradas por via TERRESTRE, +210%"
      (2.366 personas a 31-may-2026), no solo Ceuta ni todas las vias.

tabla:
  - afirmacion: >
      El Tribunal Supremo dicto sentencia (STS 814/2026) que obliga a aplicar
      el procedimiento ordinario -con asistencia juridica e interprete- en vez
      del rechazo en frontera a quien entra a nado, por no superar un "elemento
      de contencion fisico"
    fuente: "Maldita.es (independiente/fact-check); El Correo (afin-centro); Europa Press (agencia); Confilegal (juridico)"
    fecha: "dictada 29-jun-2026; explicada 5-ago-2026"
    aguanta: si
    url: "https://maldita.es/desinfo/20260805/sentencia-tribunal-supremo-devoluciones-caliente-ceuta-melilla/"
    nota: >
      Verbatim STS via Maldita: no cabe rechazo "a quienes cruzan a nado, ya
      que no superan ninguna barrera fisica"; devolucion (art. 58.3b Ley de
      Extranjeria) "en un maximo de 72 horas" con "identificacion, asistencia
      juridica y las garantias". Si se instalan "elementos de contencion
      fisicos en el mar" volveria a caber el rechazo. ROJ: STS 2965/2026
      (Confilegal). La "difusion 8-jul" NO se confirma.

  - afirmacion: >
      Existe la Instruccion 9/2026 de la Secretaria de Estado de Seguridad que
      ordena instalar barreras/boyas maritimas en Ceuta y Melilla para poder
      devolver a quienes crucen a nado
    fuente: "Andalucia Informacion (regional); Moncloa.com (afin-derecha); TheObjective + esdiario (hostil al Gobierno, via sindicato Jupol)"
    fecha: "firmada 1-ago-2026; difundida 4-5 ago"
    aguanta: si
    url: "https://www.andaluciainformacion.es/articulo/espana/interior-incluye-melilla-instalacion-barreras-maritimas-devoluciones-migrantes-que-crucen-nado/202608041525313448551.html"
    nota: >
      Define el mar como "frontera natural entre Estados" y "elemento natural
      de contencion". Jupol la tacho de "propaganda". Barrera neumatica de
      500 m operativa desde el 2-ago.

  - afirmacion: >
      Interior publico cifras incoherentes: 72.000 entradas y 70.000 salidas
      (Marlaska, 4-ago), frente a "entre 1.500 y 2.000 en diez dias" (El
      Correo, 30-jul) y ~10.000 "todavia en la ciudad" (Gobierno de Ceuta,
      11-ago)
    fuente: "Capital.es/Europa Press (oficial via agencia); El Correo (cronica); Maldita.es (Vivas)"
    fecha: "30-jul a 11-ago-2026"
    aguanta: si
    url: "https://capital.es/actualidad/interior-cifra-en-72-000-los-migrantes-que-entraron-en-ceuta-y-dice-que-70-000-retornaron/204731/"
    nota: "La cifra '50.000 entradas' del guion NO se localiza en ninguna fuente."

  - afirmacion: >
      La cifra de muertos varia segun quien cuenta: 18 (temprana) -> 83
      (Guardia Civil) -> 88 (Gobierno de Ceuta) -> 141 (Cadena SER, sumando
      aguas marroquies)
    fuente: "El Periodico/ABC-EFE (88); El Imparcial (83); Cadena SER + Antena3 (141: 78 aguas ES + 63 MA); Inmigracion y Visas (18)"
    fecha: "31-jul a 5-ago-2026"
    aguanta: parcial
    url: "https://www.elperiodico.com/es/politica/20260803/ceuta-88-muertos-entrada-masiva-migrantes-espana-marruecos-133051120"
    nota: >
      La HORQUILLA es real y depende del emisor y de que aguas se cuentan.
      El "11" del guion no se confirma; el maximo supera 88. Rango honesto:
      ~18 -> 83-88 (lado ES) -> 141 (ambos lados).

  - afirmacion: >
      Variacion interanual a 31-may-2026: total nacional -35,2% (10.224 vs
      15.769); Canarias -71% (3.184); Ceuta y Melilla via terrestre +210%
      (2.366)
    fuente: "Europa Press / 20minutos (sobre balance del Ministerio del Interior)"
    fecha: "datos a 31-may-2026; publicado 1-jun-2026"
    aguanta: si
    url: "https://www.20minutos.es/nacional/bajan-un-35-las-llegadas-irregulares-migrantes-espana-2026-pero-suben-un-210-ceuta-melilla_6977812_0.html"
    nota: "Matiz obligatorio: Ceuta Y Melilla juntas y solo via TERRESTRE."

  - afirmacion: >
      El pico del cruce fue el jueves 30-jul-2026, en coincidencia con la
      Fiesta del Trono marroqui (1.778 indultos reales anunciados el 29-jul)
    fuente: "Maldita.es (cronologia); ABC, RTVE, El Correo"
    fecha: "29-30 jul-2026"
    aguanta: si
    url: "https://maldita.es/especial-ceuta-marruecos/"
    nota: >
      Cruce masivo la madrugada/mañana del 30-jul desde Fnideq/Belyounech
      hacia el espigon del Tarajal. HECHO VERIFICADO pero OMITIDO de la carta
      por acuerdo 002 (iman de sobreatribucion; ninguna ley lo necesita).

  - afirmacion: >
      La sentencia se transformo en redes en "la frontera esta abierta / no hay
      deportacion inmediata" y en "España abre la frontera el 15 de agosto"
    fuente: "Maldita.es (investigacion)"
    fecha: "6-7 ago-2026"
    aguanta: si
    url: "https://maldita.es/investigaciones/20260806/tribunal-supremo-sentencia-ceuta-marruecos-facebook/"
    nota: >
      Maldita rastrea "como un mismo mensaje la disparo en Facebook en
      Marruecos el 30J"; el nucleo ("no hay deportacion inmediata") no es
      falsable; lo unico falsable ("España abre el 15-ago durante 15 horas")
