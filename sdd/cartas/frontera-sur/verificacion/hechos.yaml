    fuente: "Diario de Mallorca / Diario de Ibiza (regional); El Español (afin-derecha, cita Frontex)"
    fecha: "28-jul y 3-ago-2026"
    aguanta: parcial
    url: "https://www.diariodemallorca.es/mallorca/2026/07/28/ruta-migratoria-argelia-baleares-consolida-132878990.html"
    nota: >
      CONFIRMADO: "11.000 llegadas en un año y medio", "realidad estructural",
