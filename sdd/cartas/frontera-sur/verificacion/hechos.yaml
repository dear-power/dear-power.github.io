  - afirmacion: >
      Interior declaro que Marruecos coopera "de manera leal y permanente"
      en plena avalancha
    fuente: "El Correo (Melchor Saiz-Pardo), sobre comunicado oficial de Interior"
    fecha: "30-jul-2026"
    aguanta: si
    url: "https://www.elcorreo.com/politica/marlaska-destaca-ejemplar-colaboracion-marruecos-plena-avalancha-20260730153721-ntrc.html"
