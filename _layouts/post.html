---
layout: default
---
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {%- if page.to %} · <span class="addressee">To: {{ page.to }}</span>{% endif -%}
  </p>

  {{ content }}

  <p class="signoff">— {{ page.signoff | default: site.title }}</p>
</article>
